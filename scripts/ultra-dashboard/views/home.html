<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Claude Dashboard</title>
<link rel="stylesheet" href="/public/shared.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── Main content ── */
  .content { padding: 16px; }
  .header { margin-bottom: 20px; border-bottom: 1px solid #21262d; padding-bottom: 12px; }
  .header-top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 1.3em; color: #58a6ff; margin-bottom: 4px; }
  .hostname { color: #484f58; font-size: 0.85em; }
  .header-right { font-size: 0.82em; color: #8b949e; }
  .refresh-indicator { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; display: inline-block; margin-right: 6px; animation: blink 5s ease-in-out infinite; }
  @keyframes blink { 0%, 90%, 100% { opacity: 1; } 95% { opacity: 0.2; } }

  /* ── Project grid ── */
  .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .project-card { display: block; background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 16px 18px; transition: border-color 0.2s; text-decoration: none !important; }
  .project-card:hover { border-color: #30363d; }
  .project-card.has-active { border-color: #1f6feb; }
  .project-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .project-name { font-weight: 600; font-size: 1.05em; color: #e6edf3; }
  .project-card:not(.has-active) .project-name { color: #c9d1d9; }
  .active-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.72em; font-weight: 600; text-transform: uppercase; background: #1f6feb33; color: #58a6ff; }
  .project-meta { display: flex; align-items: center; gap: 12px; font-size: 0.8em; color: #8b949e; margin-top: 4px; }
  .project-meta-item { display: flex; align-items: center; gap: 4px; }
  .project-meta-item svg { opacity: 0.6; }
  .stage-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
  .stage-chip { font-size: 0.7em; padding: 1px 6px; border-radius: 10px; font-weight: 500; font-family: monospace; }
  .stage-chip-planning { background: #8b949e33; color: #8b949e; }
  .stage-chip-implementing { background: #1f6feb33; color: #58a6ff; }
  .stage-chip-reviewing { background: #d2a8ff33; color: #d2a8ff; }
  .stage-chip-testing { background: #3fb95033; color: #3fb950; }
  .stage-chip-completed { background: #23863533; color: #3fb950; }
  .stage-chip-escalated { background: #da363333; color: #f85149; }
  .no-projects { color: #484f58; padding: 40px; text-align: center; }

  @media (min-width: 640px) { .content { padding: 20px; } h1 { font-size: 1.5em; } }
</style>
</head>
<body>
<div class="usage-bar" id="usage-bar">
  <span class="ub-empty">Loading usage...</span>
</div>
<div class="content">
  <div class="header">
    <div class="header-top">
      <div>
        <h1>Ultra Claude</h1>
        <div class="hostname" id="hostname"></div>
      </div>
      <div class="header-right">
        <span class="refresh-indicator"></span>Auto-refresh 5s
      </div>
    </div>
  </div>
  <div id="projects-section"></div>
</div>

<script src="/public/usage-bar.js"></script>
<script>
document.getElementById('hostname').textContent = location.hostname;

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

var svgPlan = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0113.25 16h-9.5A1.75 1.75 0 012 14.25V1.75zm1.75-.25a.25.25 0 00-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 00.25-.25V6h-2.75A1.75 1.75 0 019 4.25V1.5H3.75zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011z"/></svg>';
var svgDocs = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M0 1.75A.75.75 0 01.75 1h4.253c1.227 0 2.317.59 3 1.501A3.744 3.744 0 0111.006 1h4.245a.75.75 0 01.75.75v10.5a.75.75 0 01-.75.75h-4.507a2.25 2.25 0 00-1.591.659l-.622.621a.75.75 0 01-1.06 0l-.622-.621A2.25 2.25 0 005.258 13H.75a.75.75 0 01-.75-.75V1.75zm7.251 10.324l.004-5.073-.002-2.253A2.25 2.25 0 005.003 2.5H1.5v9h3.757a3.75 3.75 0 011.994.574zM8.755 4.75l-.004 7.322a3.752 3.752 0 011.992-.572H14.5v-9h-3.495a2.25 2.25 0 00-2.25 2.25z"/></svg>';
var svgTracker = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 110 16A8 8 0 018 0zm0 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM6.5 7.75A.75.75 0 017.25 7h1.5a.75.75 0 01.75.75v3.5a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75v-3.5zm1.75-2.75a1 1 0 11-2 0 1 1 0 012 0z"/></svg>';

function renderProjectCard(p) {
  var hasActive = p.active_plans > 0;
  var html = '<a href="/project/' + encodeURIComponent(p.name) + '" class="project-card' + (hasActive ? ' has-active' : '') + '">' +
    '<div class="project-card-head">' +
      '<span class="project-name">' + esc(p.name) + '</span>' +
      (hasActive ? '<span class="active-badge">' + p.active_plans + ' active</span>' : '') +
    '</div>' +
    '<div class="project-meta">' +
      '<span class="project-meta-item">' + svgPlan + ' ' + p.total_plans + ' plan' + (p.total_plans !== 1 ? 's' : '') + '</span>' +
      (p.tracker_open > 0 ? '<span class="project-meta-item">' + svgTracker + ' ' + p.tracker_open + ' open</span>' : '') +
      (p.has_docs ? '<span class="project-meta-item">' + svgDocs + ' Docs</span>' : '') +
    '</div>';

  if (p.active_stages && p.active_stages.length > 0) {
    html += '<div class="stage-chips">' + p.active_stages.map(function(s) {
      return '<span class="stage-chip stage-chip-' + esc(s.status) + '">' + esc(s.task_id) + ': ' + esc(s.status) + '</span>';
    }).join(' ') + '</div>';
  }

  html += '</a>';
  return html;
}

async function refreshProjects() {
  try {
    var data = await fetch('/api/projects').then(function(r) { return r.json(); });
    var projects = data.projects || [];
    var el = document.getElementById('projects-section');

    if (projects.length === 0) {
      el.innerHTML = '<div class="no-projects">No projects registered yet</div>';
      return;
    }

    var html = '<div class="project-grid">' + projects.map(renderProjectCard).join('') + '</div>';
    el.innerHTML = html;
  } catch (e) { console.error('Refresh failed:', e); }
}

async function refresh() {
  refreshUsage();
  refreshProjects();
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
