<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PROJECT}} — Ultra Claude</title>
<link rel="stylesheet" href="/public/shared.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── Header ── */
  .header { padding: 12px 16px; border-bottom: 1px solid #21262d; flex-shrink: 0; }
  .header-top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }

  h1 { font-size: 1.3em; color: #e6edf3; margin-bottom: 2px; }
  .project-path { font-size: 0.8em; color: #484f58; font-family: monospace; }
  .header-right { font-size: 0.82em; color: #8b949e; }
  .refresh-indicator { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; display: inline-block; margin-right: 6px; animation: blink 5s ease-in-out infinite; }
  @keyframes blink { 0%, 90%, 100% { opacity: 1; } 95% { opacity: 0.2; } }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid #21262d; padding: 0 16px; flex-shrink: 0; }
  .tab { padding: 10px 20px; font-size: 0.9em; font-weight: 500; color: #8b949e; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; user-select: none; }
  .tab:hover { color: #c9d1d9; }
  .tab.active { color: #e6edf3; border-bottom-color: #58a6ff; }
  .tab.disabled { opacity: 0.35; cursor: default; }

  /* ── Tab content ── */
  .tab-content { flex: 1; overflow: hidden; position: relative; }
  .tab-pane { display: none; height: 100%; }
  .tab-pane.active { display: block; }
  .tab-pane-scroll { padding: 16px; overflow-y: auto; height: 100%; }
  .docs-frame { width: 100%; height: 100%; border: none; background: #0d1117; }

  /* ── Plan cards ── */
  .kanban { display: flex; gap: 12px; overflow-x: auto; align-items: flex-start; padding-bottom: 8px; }
  .kanban-col { flex: 1; min-width: 220px; max-width: 320px; }
  .kanban-col.col-executing { flex: 2; max-width: 480px; }
  .kanban-col-head { font-size: 0.78em; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; color: #8b949e; padding: 6px 0; margin-bottom: 8px; border-bottom: 2px solid; display: flex; justify-content: space-between; align-items: center; }
  .kanban-col-head .col-count { font-size: 0.9em; opacity: 0.6; }
  .kanban-col-cards { display: flex; flex-direction: column; gap: 8px; }
  .plan-card { display: block; background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 12px 14px; transition: border-color 0.2s; text-decoration: none !important; }
  .plan-card:hover { border-color: #30363d; }
  .plan-card.active { border-color: #1f6feb; }
  .plan-card.completed { border-color: #238636; }
  .plan-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .plan-name { font-weight: 500; font-size: 0.95em; color: #e6edf3; }
  .plan-card:not(.active):not(.completed) .plan-name { color: #8b949e; }
  h2 { font-size: 1em; color: #8b949e; margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
  .status-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.72em; font-weight: 600; text-transform: uppercase; white-space: nowrap; }
  .status-executing { background: #1f6feb33; color: #58a6ff; }
  .status-completed { background: #23863533; color: #3fb950; }
  .status-aborted { background: #da363333; color: #f85149; }
  .status-pending { background: #21262d; color: #8b949e; }
  .plan-stages { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .stage-chip { font-size: 0.7em; padding: 1px 6px; border-radius: 10px; font-weight: 500; font-family: monospace; }
  .stage-chip-planning { background: #8b949e33; color: #8b949e; }
  .stage-chip-implementing { background: #1f6feb33; color: #58a6ff; }
  .stage-chip-reviewing { background: #d2a8ff33; color: #d2a8ff; }
  .stage-chip-testing { background: #3fb95033; color: #3fb950; }
  .stage-chip-completed { background: #23863533; color: #3fb950; }
  .stage-chip-escalated { background: #da363333; color: #f85149; }
  .stale-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 6px; vertical-align: middle; }
  .stale-dot-warning { background: #d29922; }
  .stale-dot-critical { background: #f85149; }
  .plan-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; font-size: 0.78em; color: #8b949e; }
  .progress-bar { flex: 1; max-width: 160px; height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; display: flex; }
  .progress-done { height: 100%; background: #3fb950; transition: width 0.3s; }
  .progress-active { height: 100%; background: repeating-linear-gradient(90deg, #1f6feb 0px, #1f6feb 4px, #1f6feb88 4px, #1f6feb88 8px); transition: width 0.3s; }
  .no-plans { color: #484f58; padding: 20px; text-align: center; }

  /* ── Backlog ── */
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .filter-group { display: flex; gap: 4px; align-items: center; }
  .filter-label { font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.05em; color: #484f58; margin-right: 4px; font-weight: 500; }
  .filter-pill { font-size: 0.78em; padding: 3px 10px; border-radius: 12px; cursor: pointer; user-select: none; border: 1px solid; transition: all 0.15s; font-weight: 500; }
  .filter-pill.active { opacity: 1; }
  .filter-pill:not(.active) { opacity: 0.35; }
  .pill-bug { border-color: #f85149; color: #f85149; }
  .pill-bug.active { background: #f8514922; }
  .pill-question { border-color: #d29922; color: #d29922; }
  .pill-question.active { background: #d2992222; }
  .pill-idea { border-color: #d2a8ff; color: #d2a8ff; }
  .pill-idea.active { background: #d2a8ff22; }
  .pill-debt { border-color: #79c0ff; color: #79c0ff; }
  .pill-debt.active { background: #79c0ff22; }
  .pill-open { border-color: #58a6ff; color: #58a6ff; }
  .pill-open.active { background: #58a6ff22; }
  .pill-in-progress { border-color: #d29922; color: #d29922; }
  .pill-in-progress.active { background: #d2992222; }
  .pill-done { border-color: #3fb950; color: #3fb950; }
  .pill-done.active { background: #3fb95022; }
  .pill-wontfix { border-color: #484f58; color: #484f58; }
  .pill-wontfix.active { background: #484f5822; }
  .filter-sep { width: 1px; height: 20px; background: #21262d; margin: 0 8px; }

  .backlog-table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
  .backlog-table th { text-align: left; padding: 6px 10px; border-bottom: 1px solid #21262d; color: #8b949e; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 500; }
  .backlog-table td { padding: 8px 10px; border-bottom: 1px solid #161b22; vertical-align: top; }
  .backlog-table tr:hover { background: #161b22; }
  .backlog-table tr.highlight { background: #1f6feb22; transition: background 1s; }
  .cat-badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 0.78em; font-weight: 500; }
  .cat-bug { background: #f8514922; color: #f85149; }
  .cat-question { background: #d2992222; color: #d29922; }
  .cat-idea { background: #d2a8ff22; color: #d2a8ff; }
  .cat-debt { background: #79c0ff22; color: #79c0ff; }
  .priority-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .priority-high { background: #f85149; }
  .priority-medium { background: #d29922; }
  .priority-low { background: #484f58; }
  .status-open { color: #58a6ff; }
  .status-in-progress { color: #d29922; }
  .status-done { color: #3fb950; }
  .status-wontfix { color: #484f58; }
  .related-chip { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 0.75em; background: #21262d; color: #8b949e; cursor: pointer; margin-right: 3px; text-decoration: none !important; }
  .related-chip:hover { background: #30363d; color: #c9d1d9; }
  .doc-ref-chip { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 0.72em; font-family: monospace; background: #0d419d33; color: #58a6ff; cursor: pointer; margin-right: 3px; text-decoration: none !important; }
  .doc-ref-chip:hover { background: #0d419d55; color: #79c0ff; }
  .pill-high { border-color: #f85149; color: #f85149; }
  .pill-high.active { background: #f8514922; }
  .pill-medium { border-color: #d29922; color: #d29922; }
  .pill-medium.active { background: #d2992222; }
  .pill-low { border-color: #484f58; color: #484f58; }
  .pill-low.active { background: #484f5822; }
  .tab-badge { font-size: 0.75em; background: #21262d; color: #8b949e; padding: 1px 6px; border-radius: 8px; margin-left: 6px; }
  .backlog-empty { color: #484f58; padding: 40px; text-align: center; }

  @media (min-width: 640px) { .header { padding: 12px 20px; } .tab-pane-scroll { padding: 20px; } h1 { font-size: 1.5em; } .plan-card { padding: 14px 18px; } }
</style>
</head>
<body>
<div class="usage-bar" id="usage-bar">
  <span class="ub-empty">Loading usage...</span>
</div>
<div class="header">
  <div class="header-top">
    <div>
      <div class="breadcrumb"><a href="/">Dashboard</a> <span class="sep">&rsaquo;</span> {{PROJECT}}</div>
      <h1>{{PROJECT}}</h1>
      <div class="project-path" id="project-path"></div>
    </div>
    <div class="header-right">
      <span class="refresh-indicator"></span>Auto-refresh 5s
    </div>
  </div>
</div>
<div class="tabs">
  <div class="tab active" data-tab="plans">Plans</div>
  <div class="tab" data-tab="backlog" id="backlog-tab">Backlog<span class="tab-badge" id="backlog-badge" style="display:none"></span></div>
  <div class="tab" data-tab="docs" id="docs-tab">Documentation</div>
</div>
<div class="tab-content">
  <div class="tab-pane active" id="pane-plans">
    <div class="tab-pane-scroll" id="plans-section"></div>
  </div>
  <div class="tab-pane" id="pane-backlog">
    <div class="tab-pane-scroll" id="backlog-section"></div>
  </div>
  <div class="tab-pane" id="pane-docs">
    <iframe class="docs-frame" id="docs-frame" src="about:blank"></iframe>
  </div>
</div>

<script src="/public/usage-bar.js"></script>
<script>
var PROJECT = '{{PROJECT_URI}}';
var PROJECT_DISPLAY = decodeURIComponent(PROJECT);
var INITIAL_TAB = '{{INITIAL_TAB}}';
var hasDocs = false;
var docsLoaded = false;

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Tab switching ──
// Capture initial query params before any replaceState wipes them
var initialParams = new URLSearchParams(location.search);

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.dataset.tab === tabName); });
  document.querySelectorAll('.tab-pane').forEach(function(p) { p.classList.toggle('active', p.id === 'pane-' + tabName); });

  // Update URL without reload
  var suffix = '';
  if (tabName === 'docs') suffix = '/docs';
  else if (tabName === 'backlog') suffix = '/backlog';
  var url = '/project/' + PROJECT + suffix;
  history.pushState({ tab: tabName }, '', url);

  // Lazy-load docs iframe on first switch, pass page param as Docsify hash
  if (tabName === 'docs') {
    var frame = document.getElementById('docs-frame');
    if (!docsLoaded) {
      docsLoaded = true;
      var page = initialParams.get('page');
      var hash = page ? '#/' + page : '';
      frame.src = '/docs/' + PROJECT + '/' + hash;
    }
  }
}

document.querySelectorAll('.tab').forEach(function(t) {
  t.addEventListener('click', function() {
    if (this.classList.contains('disabled')) return;
    switchTab(this.dataset.tab);
  });
});

// ── Plan rendering ──
function statusClass(s) {
  if (!s) return 'pending';
  if (['executing','researching','planning','implementing','reviewing','testing'].includes(s)) return 'executing';
  if (s === 'completed') return 'completed';
  if (s === 'escalated' || s === 'aborted') return 'aborted';
  if (['stub','draft','approved'].includes(s)) return 'pending';
  return 'pending';
}

function fmtTime(sec) {
  if (!sec || sec < 0) return '';
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec/60) + 'm ' + (sec%60) + 's';
  return Math.floor(sec/3600) + 'h ' + Math.floor((sec%3600)/60) + 'm';
}

function fmtDate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  catch { return iso; }
}

function renderPlanCard(p, colKey) {
  var live = p.live_status || {};
  var status = live.status || (p.active ? 'executing' : (live.total_tasks ? 'completed' : 'not started'));
  var sc = statusClass(status);
  var total = live.total_tasks || 0;
  var done = live.completed_tasks || 0;
  var elapsed = fmtTime(live.elapsed_seconds);
  var isActive = status === 'executing';
  var compact = colKey === 'completed' || colKey === 'aborted';

  var staleDot = '';
  if (isActive && live._last_modified_ms) {
    var age = (Date.now() - live._last_modified_ms) / 1000;
    if (age > 300) staleDot = '<span class="stale-dot stale-dot-critical" title="Data stale (' + Math.round(age/60) + 'm)"></span>';
    else if (age > 120) staleDot = '<span class="stale-dot stale-dot-warning" title="Data may be stale (' + Math.round(age/60) + 'm)"></span>';
  }

  var metaHtml = '';
  if (compact) {
    metaHtml = '<div class="plan-meta">' +
      (total > 0 ? '<span>' + total + ' tasks</span>' : '') +
      (elapsed ? '<span>' + elapsed + '</span>' : '') +
    '</div>';
  } else {
    var donePct = total > 0 ? Math.round((done / total) * 100) : 0;
    var stageWeight = { planning: 0.15, implementing: 0.5, reviewing: 0.75, testing: 0.9 };
    var activeWeight = 0;
    if (live._active_stages) {
      live._active_stages.forEach(function(s) { activeWeight += (stageWeight[s.status] || 0.25); });
    }
    var activePct = total > 0 ? Math.min(100 - donePct, Math.round((activeWeight / total) * 100)) : 0;
    metaHtml = '<div class="plan-meta">' +
      (total > 0 ? '<span>' + done + '/' + total + ' tasks</span>' +
        '<div class="progress-bar"><div class="progress-done" style="width:' + donePct + '%"></div><div class="progress-active" style="width:' + activePct + '%"></div></div>' : '') +
      (elapsed ? '<span>' + elapsed + '</span>' : '') +
    '</div>';
  }

  return '<a href="/plan/' + encodeURIComponent(p.project) + '/' + encodeURIComponent(p.plan) + '" class="plan-card ' + (isActive ? 'active' : (sc === 'completed' ? 'completed' : '')) + '">' +
      '<div class="plan-card-head">' +
        '<span class="plan-name">' + esc(p.plan) + '</span>' + staleDot +
      '</div>' +
      (live._active_stages && live._active_stages.length > 0
        ? '<div class="plan-stages">' + live._active_stages.map(function(s) {
            return '<span class="stage-chip stage-chip-' + esc(s.status) + '">' + esc(s.task_id) + ': ' + esc(s.status) + '</span>';
          }).join(' ') + '</div>'
        : '') +
      metaHtml +
  '</a>';
}

// ── Data fetch ──
var projectInfoFetched = false;

async function refreshPlans() {
  try {
    var data = await fetch('/api/plans').then(function(r) { return r.json(); });
    var allPlans = data.plans || [];
    var plans = allPlans.filter(function(p) { return p.project === PROJECT_DISPLAY; });

    // Fetch project info once to get path and docs status
    if (!projectInfoFetched) {
      projectInfoFetched = true;
      var projectData = await fetch('/api/projects').then(function(r) { return r.json(); });
      var proj = (projectData.projects || []).find(function(p) { return p.name === PROJECT_DISPLAY; });
      if (proj && proj.root) {
        document.getElementById('project-path').textContent = proj.root;
      }
      hasDocs = proj && proj.has_docs;
      var docsTab = document.getElementById('docs-tab');
      if (!hasDocs) {
        docsTab.classList.add('disabled');
      }
    }

    // Render plans as kanban
    var plansEl = document.getElementById('plans-section');
    if (plans.length === 0) {
      plansEl.innerHTML = '<h2>Plans</h2><div class="no-plans">No plans for this project</div>';
    } else {
      var oneWeekAgo = Date.now() - 7 * 24 * 3600 * 1000;
      plans = plans.filter(function(p) {
        var live = p.live_status || {};
        if (live.status === 'completed' && live.ended_at && new Date(live.ended_at).getTime() < oneWeekAgo) return false;
        return true;
      });
      plans.sort(function(a, b) { return (b.plan || '').localeCompare(a.plan || ''); });
      var columns = [
        { key: 'pending', label: 'Planning', color: '#8b949e', plans: [] },
        { key: 'executing', label: 'In Progress', color: '#58a6ff', plans: [] },
        { key: 'completed', label: 'Completed', color: '#3fb950', plans: [] },
        { key: 'aborted', label: 'Aborted', color: '#f85149', plans: [] }
      ];
      var colMap = {};
      columns.forEach(function(c) { colMap[c.key] = c; });
      plans.forEach(function(p) {
        var live = p.live_status || {};
        var status = live.status || (p.active ? 'executing' : (live.total_tasks ? 'completed' : 'not started'));
        var sc = statusClass(status);
        (colMap[sc] || colMap['pending']).plans.push(p);
      });
      var html = '<h2>Plans (' + plans.length + ')</h2><div class="kanban">';
      columns.forEach(function(col) {
        if (col.key === 'aborted' && col.plans.length === 0) return;
        html += '<div class="kanban-col' + (col.key === 'executing' ? ' col-executing' : '') + '">' +
          '<div class="kanban-col-head" style="border-color:' + col.color + '">' +
            '<span>' + col.label + '</span><span class="col-count">' + col.plans.length + '</span>' +
          '</div>' +
          '<div class="kanban-col-cards">' + (col.plans.length > 0 ? col.plans.map(function(p) { return renderPlanCard(p, col.key); }).join('') : '<div class="no-plans">None</div>') + '</div>' +
        '</div>';
      });
      html += '</div>';
      plansEl.innerHTML = html;
    }
  } catch (e) { console.error('Refresh failed:', e); }
}

// ── Backlog ──
var backlogItems = [];
var backlogFilters = {
  categories: { bug: true, question: true, idea: true, debt: true },
  statuses: { open: true, 'in-progress': true, done: false, wontfix: false },
  priorities: { high: true, medium: true, low: true }
};

function toggleFilter(group, key) {
  backlogFilters[group][key] = !backlogFilters[group][key];
  renderBacklogView();
}

function scrollToItem(id) {
  var row = document.getElementById('backlog-row-' + id);
  if (row) {
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    row.classList.add('highlight');
    setTimeout(function() { row.classList.remove('highlight'); }, 2000);
  }
}

function buildRelatedMap(items) {
  // Build bidirectional map from stored related arrays
  var map = {};
  items.forEach(function(item) {
    if (!map[item.id]) map[item.id] = new Set();
    (item.related || []).forEach(function(rid) {
      map[item.id].add(rid);
      if (!map[rid]) map[rid] = new Set();
      map[rid].add(item.id);
    });
  });
  return map;
}

var priorityOrder = { high: 0, medium: 1, low: 2 };

function openDocRef(ref) {
  // Strip line range for Docsify navigation
  var page = ref.replace(/:\d+[-–]\d+$/, '').replace(/:\d+$/, '');
  // Switch to docs tab and load the page
  switchTab('docs');
  var frame = document.getElementById('docs-frame');
  docsLoaded = true;
  frame.src = '/docs/' + PROJECT + '/#/' + page;
}

function renderBacklogView() {
  var el = document.getElementById('backlog-section');
  var filtered = backlogItems.filter(function(item) {
    var cat = item._category || 'idea';
    return backlogFilters.categories[cat] && backlogFilters.statuses[item.status] && backlogFilters.priorities[item.priority];
  });
  // Sort by priority (high first), then by ID
  filtered.sort(function(a, b) {
    var pa = priorityOrder[a.priority] !== undefined ? priorityOrder[a.priority] : 1;
    var pb = priorityOrder[b.priority] !== undefined ? priorityOrder[b.priority] : 1;
    if (pa !== pb) return pa - pb;
    return a.id.localeCompare(b.id);
  });
  var relatedMap = buildRelatedMap(backlogItems);
  var hasRelated = backlogItems.some(function(item) { return (item.related && item.related.length > 0); });
  var hasDocRefs = backlogItems.some(function(item) { return (item.doc_refs && item.doc_refs.length > 0); });
  var hasBlocks = backlogItems.some(function(item) { return (item.blocks && item.blocks.length > 0); });
  var hasBlockedBy = backlogItems.some(function(item) { return (item._blocked_by && item._blocked_by.length > 0); });

  // Filter pills
  var html = '<div class="filter-row">' +
    '<div class="filter-group"><span class="filter-label">Category</span>';
  [['bug','Bugs'],['question','Questions'],['idea','Ideas'],['debt','Debt']].forEach(function(pair) {
    html += '<span class="filter-pill pill-' + pair[0] + (backlogFilters.categories[pair[0]] ? ' active' : '') + '" onclick="toggleFilter(\'categories\',\'' + pair[0] + '\')">' + pair[1] + '</span>';
  });
  html += '</div><div class="filter-sep"></div><div class="filter-group"><span class="filter-label">Status</span>';
  [['open','Open'],['in-progress','Active'],['done','Done'],['wontfix','Skip']].forEach(function(pair) {
    html += '<span class="filter-pill pill-' + pair[0] + (backlogFilters.statuses[pair[0]] ? ' active' : '') + '" onclick="toggleFilter(\'statuses\',\'' + pair[0] + '\')">' + pair[1] + '</span>';
  });
  html += '</div><div class="filter-sep"></div><div class="filter-group"><span class="filter-label">Priority</span>';
  [['high','High'],['medium','Med'],['low','Low']].forEach(function(pair) {
    html += '<span class="filter-pill pill-' + pair[0] + (backlogFilters.priorities[pair[0]] ? ' active' : '') + '" onclick="toggleFilter(\'priorities\',\'' + pair[0] + '\')">' + pair[1] + '</span>';
  });
  html += '</div></div>';

  if (filtered.length === 0) {
    html += '<div class="backlog-empty">' + (backlogItems.length === 0 ? 'No backlog items yet' : 'No items match current filters') + '</div>';
  } else {
    html += '<table class="backlog-table"><thead><tr>' +
      '<th>ID</th><th>Category</th><th>Pri</th><th>Title</th><th>Status</th>' +
      (hasBlocks ? '<th>Blocks</th>' : '') +
      (hasBlockedBy ? '<th>Blocked By</th>' : '') +
      (hasDocRefs ? '<th>Docs</th>' : '') +
      (hasRelated ? '<th>Related</th>' : '') +
      '</tr></thead><tbody>';
    filtered.forEach(function(item) {
      var cat = item._category || 'idea';
      var related = relatedMap[item.id] ? Array.from(relatedMap[item.id]) : [];
      var refs = item.doc_refs || [];
      html += '<tr id="backlog-row-' + esc(item.id) + '">' +
        '<td style="white-space:nowrap;color:#8b949e;font-family:monospace;font-size:0.85em">' + esc(item.id) + '</td>' +
        '<td><span class="cat-badge cat-' + esc(cat) + '">' + esc(cat) + '</span></td>' +
        '<td><span class="priority-dot priority-' + esc(item.priority) + '" title="' + esc(item.priority) + '"></span></td>' +
        '<td>' + esc(item.title) + (item.notes ? '<br><span style="font-size:0.8em;color:#484f58">' + esc(item.notes) + '</span>' : '') + '</td>' +
        '<td><span class="status-' + esc(item.status) + '">' + esc(item.status) + '</span></td>';
      if (hasBlocks) {
        var blocks = item.blocks || [];
        html += '<td>' + blocks.map(function(bid) {
          return '<a class="related-chip" style="background:#da363322;color:#f85149" onclick="scrollToItem(\'' + esc(bid) + '\')">' + esc(bid) + '</a>';
        }).join('') + '</td>';
      }
      if (hasBlockedBy) {
        var blockedBy = item._blocked_by || [];
        html += '<td>' + blockedBy.map(function(bid) {
          return '<a class="related-chip" style="background:#d2992222;color:#d29922" onclick="scrollToItem(\'' + esc(bid) + '\')">' + esc(bid) + '</a>';
        }).join('') + '</td>';
      }
      if (hasDocRefs) {
        html += '<td>' + refs.map(function(ref) {
          return '<a class="doc-ref-chip" onclick="openDocRef(\'' + esc(ref) + '\')" title="Open in docs">' + esc(ref) + '</a>';
        }).join('') + '</td>';
      }
      if (hasRelated) {
        html += '<td>' + related.map(function(rid) {
          return '<a class="related-chip" onclick="scrollToItem(\'' + esc(rid) + '\')">' + esc(rid) + '</a>';
        }).join('') + '</td>';
      }
      html += '</tr>';
    });
    html += '</tbody></table>';
  }

  // Summary line
  var open = backlogItems.filter(function(i) { return i.status === 'open'; }).length;
  var inProg = backlogItems.filter(function(i) { return i.status === 'in-progress'; }).length;
  var done = backlogItems.filter(function(i) { return i.status === 'done'; }).length;
  var high = backlogItems.filter(function(i) { return i.priority === 'high' && i.status !== 'done' && i.status !== 'wontfix'; }).length;
  if (backlogItems.length > 0) {
    html += '<div style="font-size:0.78em;color:#484f58;margin-top:10px">' +
      open + ' open, ' + inProg + ' active, ' + done + ' done' +
      (high > 0 ? ' · <span style="color:#f85149">' + high + ' high priority</span>' : '') +
    '</div>';
  }

  el.innerHTML = html;
}

async function refreshBacklog() {
  try {
    var data = await fetch('/api/backlog/' + PROJECT).then(function(r) { return r.json(); });
    backlogItems = data.items || [];
    // Update badge
    var badge = document.getElementById('backlog-badge');
    var openCount = (data.summary && (data.summary.open + data.summary.in_progress)) || 0;
    if (openCount > 0) {
      badge.textContent = openCount;
      badge.style.display = '';
    } else {
      badge.style.display = 'none';
    }
    // Re-render if backlog tab is active
    if (document.getElementById('pane-backlog').classList.contains('active')) {
      renderBacklogView();
    }
  } catch (e) { console.error('Backlog refresh failed:', e); }
}

async function refresh() {
  refreshUsage();
  refreshPlans();
  refreshBacklog();
}

// Handle browser back/forward
window.addEventListener('popstate', function(e) {
  var tab = (e.state && e.state.tab) || 'plans';
  // Switch tab without pushing another history entry
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.dataset.tab === tab); });
  document.querySelectorAll('.tab-pane').forEach(function(p) { p.classList.toggle('active', p.id === 'pane-' + tab); });
  if (tab === 'docs' && !docsLoaded) {
    docsLoaded = true;
    document.getElementById('docs-frame').src = '/docs/' + PROJECT + '/';
  }
  if (tab === 'backlog') renderBacklogView();
});

// Replace initial state so popstate knows the starting tab
history.replaceState({ tab: INITIAL_TAB || 'plans' }, '');

// Switch to initial tab immediately (don't wait for async fetches)
if (INITIAL_TAB === 'docs') {
  switchTab('docs');
} else if (INITIAL_TAB === 'backlog') {
  switchTab('backlog');
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
