<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PLAN_NAME}} — {{PROJECT}}</title>
<link rel="stylesheet" href="/public/shared.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }

  h1 { font-size: 1.2em; color: #58a6ff; margin-bottom: 4px; }
  h2 { font-size: 1em; color: #8b949e; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
  .header { border-bottom: 1px solid #21262d; padding: 12px 16px; flex-shrink: 0; }
  .header-top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  .header-right { font-size: 0.82em; color: #8b949e; }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid #21262d; padding: 0 16px; flex-shrink: 0; }
  .tab { padding: 10px 20px; font-size: 0.9em; font-weight: 500; color: #8b949e; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; user-select: none; }
  .tab:hover { color: #c9d1d9; }
  .tab.active { color: #e6edf3; border-bottom-color: #58a6ff; }

  /* ── Tab content ── */
  .tab-content { flex: 1; overflow: hidden; position: relative; }
  .tab-pane { display: none; height: 100%; }
  .tab-pane.active { display: block; }
  .tab-pane-scroll { padding: 12px 16px; overflow-y: auto; height: 100%; }
  .docs-frame { width: 100%; height: 100%; border: none; background: #0d1117; }
  .status-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75em; font-weight: 600; text-transform: uppercase; white-space: nowrap; }
  .status-executing, .status-in_progress { background: #1f6feb33; color: #58a6ff; }
  .status-completed { background: #23863533; color: #3fb950; }
  .status-aborted, .status-failed { background: #da363333; color: #f85149; }
  .status-pending { background: #21262d; color: #8b949e; }
  .counters { display: flex; gap: 16px; margin: 10px 0; flex-wrap: wrap; }
  .counter { text-align: center; }
  .counter-value { font-size: 1.6em; font-weight: 700; }
  .counter-label { font-size: 0.7em; color: #8b949e; text-transform: uppercase; }
  .counter-active .counter-value { color: #58a6ff; }
  .counter-done .counter-value { color: #3fb950; }
  .counter-pending .counter-value { color: #8b949e; }
  .counter-total .counter-value { color: #c9d1d9; }
  .kanban { display: flex; gap: 12px; overflow-x: auto; align-items: flex-start; padding-bottom: 8px; }
  .kanban-col { flex: 1; min-width: 220px; max-width: 320px; }
  .kanban-col.col-executing { flex: 2; max-width: 480px; }
  .kanban-col-head { font-size: 0.78em; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; color: #8b949e; padding: 6px 0; margin-bottom: 8px; border-bottom: 2px solid; display: flex; justify-content: space-between; align-items: center; }
  .kanban-col-head .col-count { font-size: 0.9em; opacity: 0.6; }
  .kanban-col-cards { display: flex; flex-direction: column; gap: 8px; }
  .task-list { display: flex; flex-direction: column; gap: 6px; }
  .task-list-wide { display: flex; flex-direction: column; gap: 6px; max-width: 640px; }
  .task-item { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 10px 12px; }
  .task-item.active { border-color: #1f6feb; }
  .task-item.completed { border-color: #238636; }
  .task-item.escalated { border-color: #da3633; }
  .task-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
  .task-id { font-weight: 600; color: #8b949e; font-family: monospace; font-size: 0.82em; }
  .task-item.active .task-id { color: #58a6ff; }
  .task-item.completed .task-id { color: #3fb950; }
  .task-title { color: #e6edf3; font-weight: 500; font-size: 0.92em; line-height: 1.3; }
  .task-item:not(.active):not(.completed):not(.escalated) .task-title { color: #8b949e; }
  .task-item.completed .task-title { color: #3fb950; }
  .task-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px; font-size: 0.78em; }
  .task-deps { color: #484f58; }
  .task-timing { color: #8b949e; }
  .task-retries { color: #d29922; }
  .task-details { margin-top: 8px; }
  .stages { display: flex; gap: 3px; margin-bottom: 4px; }
  .stage { flex: 1; height: 6px; border-radius: 3px; background: #21262d; }
  .stage.done { background: #3fb950; }
  .stage.active { background: #58a6ff; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .stage-labels { display: flex; gap: 3px; margin-bottom: 6px; }
  .stage-label { flex: 1; font-size: 0.6em; text-align: center; color: #484f58; text-transform: uppercase; }
  .stage-label.done { color: #3fb950; }
  .stage-label.active { color: #58a6ff; }
  .members { display: flex; gap: 4px; flex-wrap: wrap; }
  .member { font-size: 0.75em; padding: 2px 6px; border-radius: 4px; background: #0d1117; display: inline-flex; gap: 6px; }
  .member-name { color: #c9d1d9; }
  .member-status { font-weight: 600; }
  .member-status.active { color: #58a6ff; }
  .member-status.idle { color: #484f58; }
  .member-status.completed { color: #3fb950; }
  .member-status.crashed { color: #f85149; }
  .member-status.rate-limited { color: #d29922; }
  .events-log { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 10px 12px; max-height: 300px; overflow-y: auto; }
  .event { padding: 3px 0; border-bottom: 1px solid #21262d22; font-size: 0.78em; }
  .event:last-child { border-bottom: none; }
  .event-time { color: #484f58; font-family: monospace; font-size: 0.9em; margin-right: 8px; }
  .event-type { font-weight: 600; margin-right: 8px; }
  .event-type.team_spawned { color: #58a6ff; }
  .event-type.team_shutdown { color: #8b949e; }
  .event-type.stage_entered { color: #d2a8ff; }
  .event-type.task_completed { color: #3fb950; }
  .event-type.task_escalated { color: #f85149; }
  .event-type.implementation_approved { color: #3fb950; }
  .event-msg { color: #c9d1d9; }
  .refresh-indicator { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; display: inline-block; margin-right: 6px; animation: blink 3s ease-in-out infinite; }
  @keyframes blink { 0%, 90%, 100% { opacity: 1; } 95% { opacity: 0.2; } }
  .staleness-banner { display: none; padding: 8px 14px; border-radius: 6px; font-size: 0.85em; font-weight: 500; margin-bottom: 12px; }
  .staleness-warning { display: block; background: #d2992233; color: #d29922; border: 1px solid #d2992255; }
  .staleness-critical { display: block; background: #da363333; color: #f85149; border: 1px solid #da363355; }
  .description { font-size: 0.85em; color: #8b949e; margin-top: 4px; line-height: 1.4; }
  .dep-graph { font-family: monospace; font-size: 0.72em; color: #484f58; white-space: pre; line-height: 1.4; background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
  @media (min-width: 640px) { .header { padding: 12px 20px; } .tab-pane-scroll { padding: 16px 20px; } h1 { font-size: 1.4em; } .counter-value { font-size: 1.8em; } .counters { gap: 24px; } .task-item { padding: 12px 16px; } .task-title { font-size: 0.95em; } .event { display: flex; gap: 8px; } .events-log { max-height: 400px; padding: 14px; } }
</style>
</head>
<body>
<div class="usage-bar" id="usage-bar">
  <span class="ub-empty">Loading usage...</span>
</div>
<div class="header">
  <div class="breadcrumb"><a href="/">Dashboard</a> <span class="sep">&rsaquo;</span> <a href="/project/{{PROJECT_URI}}">{{PROJECT}}</a> <span class="sep">&rsaquo;</span> {{PLAN_NAME}}</div>
  <div class="header-top">
    <h1 id="project-name">Loading...</h1>
    <div class="header-right">
      <span class="refresh-indicator"></span>Auto-refresh 3s
      <span id="project-timing"></span>
    </div>
  </div>
  <div class="description" id="project-desc"></div>
</div>
<div class="tabs">
  <div class="tab active" data-tab="tasks">Tasks</div>
  <div class="tab" data-tab="docs">Documentation</div>
</div>
<div class="tab-content">
  <div class="tab-pane active" id="pane-tasks">
    <div class="tab-pane-scroll">
      <div class="staleness-banner" id="staleness-banner"></div>
      <div class="counters" id="counters"></div>
      <h2>Tasks</h2>
      <div class="task-list" id="tasks"></div>
      <h2>Event Log</h2>
      <div class="events-log" id="events"></div>
    </div>
  </div>
  <div class="tab-pane" id="pane-docs">
    <iframe class="docs-frame" id="docs-frame" src="about:blank"></iframe>
  </div>
</div>

<script src="/public/usage-bar.js"></script>
<script>
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const API_BASE = '/api/plan/{{PROJECT_URI}}/{{PLAN_NAME_URI}}';
var docsLoaded = false;

// ── Tab switching ──
function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.dataset.tab === tabName); });
  document.querySelectorAll('.tab-pane').forEach(function(p) { p.classList.toggle('active', p.id === 'pane-' + tabName); });
  if (tabName === 'docs' && !docsLoaded) {
    docsLoaded = true;
    document.getElementById('docs-frame').src = '/docs/{{PROJECT_URI}}/#/plans/{{PLAN_NAME_URI}}/README';
  }
}
document.querySelectorAll('.tab').forEach(function(t) {
  t.addEventListener('click', function() { switchTab(this.dataset.tab); });
});
const STAGE_ORDER = ['planning', 'implementation', 'review', 'testing'];
// Active stage is detected from stages object (stage with started_at but no ended_at)
function getActiveStage(stages) {
  if (!stages) return '';
  for (var s of STAGE_ORDER) {
    if (stages[s] && stages[s].started_at && !stages[s].ended_at) return s;
  }
  return '';
}

function statusClass(s) {
  if (s === 'in_progress' || s === 'executing') return 'executing';
  if (s === 'completed') return 'completed';
  if (s === 'failed' || s === 'escalated') return 'aborted';
  if (['stub', 'draft', 'approved', 'pending'].includes(s)) return 'pending';
  return 'pending';
}

function fmtTime(sec) {
  if (!sec || sec < 0) return '\u2014';
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec / 60) + 'm ' + (sec % 60) + 's';
  return Math.floor(sec / 3600) + 'h ' + Math.floor((sec % 3600) / 60) + 'm';
}

function fmtEventTime(iso) {
  if (!iso) return '';
  try { const d = new Date(iso); return d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
  catch { return iso; }
}

function renderStaleness(p) {
  const banner = document.getElementById('staleness-banner');
  if ((p.status !== 'in_progress' && p.status !== 'executing') || !p._last_modified_ms) { banner.style.display = 'none'; return; }
  const ageSeconds = (Date.now() - p._last_modified_ms) / 1000;
  if (ageSeconds > 300) {
    banner.className = 'staleness-banner staleness-critical';
    banner.textContent = 'Data is stale (' + Math.round(ageSeconds / 60) + 'm old) \u2014 PM agent may have crashed or hit a rate limit';
  } else if (ageSeconds > 120) {
    banner.className = 'staleness-banner staleness-warning';
    banner.textContent = 'Data may be stale (' + Math.round(ageSeconds / 60) + 'm since last update)';
  } else { banner.style.display = 'none'; }
}

function renderProject(p, planData) {
  var displayStatus = p.status || 'not started';
  document.getElementById('project-name').innerHTML =
    (p.name || 'Plan') + ' <span class="status-badge status-' + statusClass(displayStatus) + '">' + displayStatus + '</span>';
  document.getElementById('project-desc').textContent = p.description || '';
  document.getElementById('project-timing').textContent = p.elapsed_seconds ? fmtTime(p.elapsed_seconds) : '';
  var total = p.total_tasks || (planData && planData.tasks ? planData.tasks.length : 0);
  document.getElementById('counters').innerHTML =
    '<div class="counter counter-total"><div class="counter-value">' + total + '</div><div class="counter-label">Total</div></div>' +
    '<div class="counter counter-active"><div class="counter-value">' + (p.active_tasks || 0) + '</div><div class="counter-label">Active</div></div>' +
    '<div class="counter counter-done"><div class="counter-value">' + (p.completed_tasks || 0) + '</div><div class="counter-label">Done</div></div>' +
    '<div class="counter counter-pending"><div class="counter-value">' + (p.pending_tasks || total) + '</div><div class="counter-label">Pending</div></div>';
}

function taskStatusClass(team) {
  if (!team) return 'pending';
  if (team.status === 'completed') return 'completed';
  if (team.status === 'failed' || team.status === 'escalated') return 'aborted';
  if (team.status === 'in_progress') return 'executing';
  if (team.status === 'pending') return 'pending';
  return 'executing'; // legacy fallback for old status values
}

function renderTasks(planData, teams, planStatus) {
  const el = document.getElementById('tasks');
  if (!planData.tasks || !planData.tasks.length) {
    if (!teams.length) { el.innerHTML = '<div style="color:#484f58">No tasks found</div>'; return; }
    el.innerHTML = teams.map(t => renderActiveTask(t, null)).join('');
    return;
  }
  const teamMap = {};
  teams.forEach(t => { teamMap[t.task_id] = t; });
  const planDone = planStatus === 'completed' || planStatus === 'failed' || planStatus === 'escalated' || planStatus === 'aborted';

  if (planDone) {
    // Completed plan — simple list, no kanban
    const items = planData.tasks.map(task => {
      const team = teamMap[task.task_id];
      return team ? renderActiveTask(team, task, true) : renderQueuedTask(task);
    });
    const graph = planData.dependency_graph ? '<div class="dep-graph">' + planData.dependency_graph.replace(/</g, '&lt;') + '</div>' : '';
    el.innerHTML = '<div class="task-list-wide">' + items.join('') + '</div>' + graph;
    return;
  }

  const columns = [
    { key: 'pending', label: 'Queued', color: '#8b949e', items: [] },
    { key: 'executing', label: 'In Progress', color: '#58a6ff', items: [] },
    { key: 'completed', label: 'Completed', color: '#3fb950', items: [] },
    { key: 'aborted', label: 'Escalated', color: '#f85149', items: [] }
  ];
  const colMap = {};
  columns.forEach(c => { colMap[c.key] = c; });

  planData.tasks.forEach(task => {
    const team = teamMap[task.task_id];
    const sc = taskStatusClass(team);
    const html = team ? renderActiveTask(team, task, sc !== 'executing') : renderQueuedTask(task);
    (colMap[sc] || colMap['pending']).items.push(html);
  });

  let html = '<div class="kanban">';
  columns.forEach(col => {
    if (col.key === 'aborted' && col.items.length === 0) return;
    html += '<div class="kanban-col' + (col.key === 'executing' ? ' col-executing' : '') + '">' +
      '<div class="kanban-col-head" style="border-color:' + col.color + '">' +
        '<span>' + col.label + '</span><span class="col-count">' + col.items.length + '</span>' +
      '</div>' +
      '<div class="kanban-col-cards">' + (col.items.length > 0 ? col.items.join('') : '<div style="color:#484f58;font-size:0.82em">None</div>') + '</div>' +
    '</div>';
  });
  html += '</div>';
  const graph = planData.dependency_graph ? '<div class="dep-graph">' + planData.dependency_graph.replace(/</g, '&lt;') + '</div>' : '';
  el.innerHTML = html + graph;
}

function renderActiveTask(t, planTask, compact) {
  const cardClass = ['completed', 'failed', 'escalated'].includes(t.status) ? (t.status === 'escalated' ? 'failed' : t.status) : 'active';
  const retries = t.retry_count > 0 ? '<span class="task-retries">retries: ' + t.retry_count + '</span>' : '';
  const deps = planTask && planTask.dependencies && planTask.dependencies !== 'None'
    ? '<span class="task-deps">dep: ' + planTask.dependencies + '</span>' : '';
  const meta = [deps, retries, '<span class="task-timing">' + fmtTime(t.elapsed_seconds) + '</span>'].filter(Boolean).join('');
  let details = '';
  if (!compact) {
    const activeStage = getActiveStage(t.stages);
    const stages = STAGE_ORDER.map(s => {
      let cls = '';
      if (t.status === 'completed' || t.status === 'failed' || t.status === 'escalated') cls = 'done';
      else if (t.stages && t.stages[s] && t.stages[s].ended_at) cls = 'done';
      else if (t.stages && t.stages[s] && t.stages[s].started_at && !t.stages[s].ended_at) cls = 'active';
      return { name: s, cls };
    });
    const stagesBars = stages.map(s => '<div class="stage ' + s.cls + '"></div>').join('');
    const stagesLabels = stages.map(s => '<div class="stage-label ' + s.cls + '">' + s.name.slice(0, 3) + '</div>').join('');
    const members = (t.members || []).map(m =>
      '<div class="member"><span class="member-name">' + m.name + '</span>' +
      '<span class="member-status ' + (m.status || '').replace('-', '') + '">' + (m.status || '?') + '</span></div>'
    ).join('');
    details = '<div class="task-details"><div class="stages">' + stagesBars + '</div><div class="stage-labels">' + stagesLabels + '</div><div class="members">' + members + '</div></div>';
  }
  return '<div class="task-item ' + cardClass + '">' +
    '<div class="task-head"><span class="task-id">' + (t.task_id || '') + '</span><span class="status-badge status-' + statusClass(t.status) + '">' + (t.status || '') + '</span></div>' +
    '<div class="task-title">' + (t.task_name || (planTask && planTask.title) || '') + '</div>' +
    (meta ? '<div class="task-meta">' + meta + '</div>' : '') +
    details + '</div>';
}

function renderQueuedTask(task) {
  const deps = task.dependencies && task.dependencies !== 'None' ? '<span class="task-deps">dep: ' + task.dependencies + '</span>' : '';
  return '<div class="task-item"><div class="task-head"><span class="task-id">' + task.task_id + '</span><span class="status-badge status-pending">queued</span></div>' +
    '<div class="task-title">' + task.title + '</div>' + (deps ? '<div class="task-meta">' + deps + '</div>' : '') + '</div>';
}

function renderEvents(data) {
  const el = document.getElementById('events');
  const events = (data.events || []).slice().reverse();
  if (!events.length) { el.innerHTML = '<div style="color:#484f58">No events yet</div>'; return; }
  el.innerHTML = events.map(e =>
    '<div class="event"><span class="event-time">' + fmtEventTime(e.timestamp) + '</span>' +
    '<span class="event-type ' + (e.type || '') + '">' + (e.type || '').replace(/_/g, ' ') + '</span>' +
    '<span class="event-msg">' + (e.message || '') + '</span></div>'
  ).join('');
}

async function refresh() {
  refreshUsage();
  try {
    const [proj, teams, events, plan] = await Promise.all([
      fetch(API_BASE + '/project').then(r => r.json()),
      fetch(API_BASE + '/teams').then(r => r.json()),
      fetch(API_BASE + '/events').then(r => r.json()),
      fetch(API_BASE + '/plan').then(r => r.json())
    ]);
    renderProject(proj, plan);
    renderStaleness(proj);
    renderTasks(plan, teams, proj.status);
    renderEvents(events);
  } catch (e) { console.error('Refresh failed:', e); }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
